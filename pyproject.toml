[project]
name = "momo-skills"
version = "1.0.0"
description = "Generic Claude Code skills (momo) — pytest suite for the skill scripts"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
